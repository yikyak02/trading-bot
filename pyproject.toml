[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-stock-bot"
version = "0.1.0"
description = "Daily stock research, explainable backtests, and paper-only execution"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "pyarrow>=17,<24", "exchange-calendars>=4.5,<5", "requests>=2.32,<3",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
stockbot = "trading_bot.cli:main"

[tool.setuptools.packages.find]
include = ["trading_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
